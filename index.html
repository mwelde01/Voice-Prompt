<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src *; connect-src *; font-src 'self' data:;"
  />
  <title>VoicePrompt Desktop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!--  EDITOR VIEW                                               -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <div id="editor-view">

    <header class="app-header">
      <div class="logo-row">
        <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="20" cy="20" r="19" stroke="#58a6ff" stroke-width="2"/>
          <circle cx="20" cy="16" r="5" fill="#58a6ff"/>
          <path d="M12 28c0-4.418 3.582-8 8-8s8 3.582 8 8" stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
          <path d="M26 20c2 1.5 3 4 3 6" stroke="#3fb950" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
          <path d="M14 20c-2 1.5-3 4-3 6" stroke="#3fb950" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        </svg>
        <h1>VoicePrompt Desktop</h1>
      </div>
      <p class="app-subtitle">A teleprompter that follows your voice — word by word</p>
    </header>

    <div class="top-controls">
      <!-- Mode selector -->
      <div class="mode-selector" role="group" aria-label="Scroll mode">
        <button class="mode-btn active" data-mode="voice" id="voice-mode-btn">
          <span class="mode-icon">🎤</span> Voice Mode
        </button>
        <button class="mode-btn" data-mode="autoscroll" id="autoscroll-mode-btn">
          <span class="mode-icon">⏩</span> Auto-Scroll
        </button>
      </div>

      <!-- Language -->
      <div class="control-group">
        <label for="language-select">Language</label>
        <select id="language-select">
          <option value="en-US">English (US)</option>
          <option value="en-GB">English (UK)</option>
          <option value="en-AU">English (AU)</option>
          <option value="es-ES">Español (España)</option>
          <option value="es-MX">Español (México)</option>
          <option value="fr-FR">Français</option>
          <option value="de-DE">Deutsch</option>
          <option value="it-IT">Italiano</option>
          <option value="pt-BR">Português (BR)</option>
          <option value="pt-PT">Português (PT)</option>
          <option value="nl-NL">Nederlands</option>
          <option value="ru-RU">Русский</option>
          <option value="ja-JP">日本語</option>
          <option value="ko-KR">한국어</option>
          <option value="zh-CN">中文 (简体)</option>
          <option value="zh-TW">中文 (繁體)</option>
          <option value="ar-SA">العربية</option>
          <option value="hi-IN">हिन्दी</option>
          <option value="pl-PL">Polski</option>
          <option value="sv-SE">Svenska</option>
        </select>
      </div>
    </div>

    <!-- Script input -->
    <div class="script-wrapper">
      <textarea
        id="script-input"
        placeholder="Paste or type your script here…

VoicePrompt will listen to your voice and highlight each word as you speak it, automatically scrolling to keep pace with you.

— Voice Mode: Speak naturally; the script follows your voice in real time
— Auto-Scroll: Scrolls at a fixed speed you control with the slider

Tip: Click any word in the teleprompter view to jump to that position."
        spellcheck="false"
        autocomplete="off"
      ></textarea>
      <div class="char-count" id="char-count">0 words</div>
    </div>

    <div class="bottom-controls">
      <div class="sliders-row">
        <!-- Font size -->
        <div class="control-group">
          <label for="font-size-slider">Font Size</label>
          <input type="range" id="font-size-slider" min="18" max="80" value="36" />
          <span class="slider-value" id="font-size-display">36px</span>
        </div>

        <!-- Speed (auto-scroll only) -->
        <div class="control-group" id="speed-control-wrap">
          <label for="speed-slider">Speed</label>
          <input type="range" id="speed-slider" min="1" max="10" value="4" />
          <span class="slider-value" id="speed-display">4</span>
        </div>
      </div>

      <button id="start-btn" class="start-btn" disabled>
        Start Teleprompter &rarr;
      </button>
    </div>

  </div><!-- /#editor-view -->


  <!-- ═══════════════════════════════════════════════════════════ -->
  <!--  TELEPROMPTER VIEW                                         -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <div id="teleprompter-view" aria-label="Teleprompter">

    <!-- Top control bar -->
    <div id="tele-controls" class="tele-controls">
      <button id="back-btn" class="tele-btn" title="Back to editor (Esc)">
        ← Back
      </button>

      <button id="play-pause-btn" class="tele-btn tele-btn-primary" title="Play / Pause (Space)">
        ⏸ Pause
      </button>

      <!-- Live speed slider -->
      <div class="control-group tele-control-group" id="tele-speed-wrap">
        <label for="tele-speed-slider">Speed</label>
        <input type="range" id="tele-speed-slider" min="1" max="10" value="4" />
        <span class="slider-value" id="tele-speed-display">4</span>
      </div>

      <!-- Font size (live) -->
      <div class="control-group tele-control-group">
        <label for="tele-font-slider">Size</label>
        <input type="range" id="tele-font-slider" min="18" max="80" value="36" />
      </div>

      <!-- Progress bar -->
      <div id="progress-bar-container" title="Scroll progress">
        <div id="progress-bar"></div>
        <span id="progress-label">0%</span>
      </div>

      <!-- Mode badge -->
      <div id="mode-badge" class="mode-badge"></div>
    </div>

    <!-- Script content -->
    <div id="tele-content">
      <div id="words-container"></div>
      <div class="end-spacer"></div>
    </div>

    <!-- Status indicator -->
    <div id="status-indicator">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">Ready</span>
    </div>

    <!-- Keyboard hint -->
    <div id="kbd-hints">
      <span><kbd>Space</kbd> Play/Pause</span>
      <span><kbd>Esc</kbd> Back</span>
      <span><kbd>← →</kbd> Step</span>
    </div>

  </div><!-- /#teleprompter-view -->

  <script src="renderer.js"></script>
</body>
</html>
